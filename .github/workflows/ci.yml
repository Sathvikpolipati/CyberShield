name: CyberShield CI & Test Suite

on:
  push:
    branches: ["main", "gh-pages"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    name: Run Security Test Suite & Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest fastapi uvicorn psutil rich scapy pydantic Jinja2

      - name: Run Test Suite
        run: |
          python -m pytest -v tests/
